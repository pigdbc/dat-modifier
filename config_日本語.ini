# ============================================
# DATフィールド修正ツール - 設定ファイル
# DAT Field Modifier - Configuration
# ============================================
#
# 【テンプレート/Template】
# 下記のテンプレートをコピーして新しいルールを追加してください：
#
# ; ========== テンプレート開始 ==========
# [Rule-X]
# ; ルール名
# Name = Phone-X
# ; 開始バイト位置(1から始まる)
# StartByte = 100
# ; 電話番号の長さ(文字数)
# PhoneLength = 10
# ; 旧フォーマット：先頭0の数
# OldLeadingZeros = 0
# ; 旧フォーマット：末尾0の数
# OldTrailingZeros = 10
# ; 新フォーマット：先頭0の数
# NewLeadingZeros = 6
# ; 新フォーマット：末尾0の数
# NewTrailingZeros = 4
# ; ========== テンプレート終了 ==========
#
# 【機能説明】
# 電話番号フィールドを旧フォーマットから新フォーマットに変換：
# 旧: [電話番号][末尾0]  例: 13812345670000000000
# 新: [先頭0][電話番号][末尾0]  例: 00000013812345670000
#
# 【注意事項】
# - バイト位置は1から始まります (1-indexed)
# - OldLeadingZeros + PhoneLength + OldTrailingZeros = 総フィールド長
# - NewLeadingZeros + PhoneLength + NewTrailingZeros = 総フィールド長
# ============================================

[Settings]
; 各レコードのバイト数
RecordSize = 1300
; ヘッダーレコード識別子
HeaderMarker = 1
; データレコード識別子
DataMarker = 2

# ============================================
# 修正ルール設定
# ============================================

[Rule-1]
Name = Phone-1
StartByte = 100
PhoneLength = 10
OldLeadingZeros = 0
OldTrailingZeros = 10
NewLeadingZeros = 6
NewTrailingZeros = 4

[Rule-2]
Name = Phone-2
StartByte = 200
PhoneLength = 10
OldLeadingZeros = 0
OldTrailingZeros = 10
NewLeadingZeros = 6
NewTrailingZeros = 4

# ============================================
# 以下に追加のルールを記述してください...
# ============================================
