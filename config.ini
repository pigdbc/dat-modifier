# ============================================
# DAT字段修改工具 - 配置文件
# DAT Field Modifier - Configuration
# ============================================
#
# 【模版/Template】
# 复制下面的模版来添加新规则：
# Copy the template below to add new rules:
#
# ; ========== 模版开始 / Template Start ==========
# [Rule-X]
# ; 规则名称 / Rule name
# Name = Phone-X
# ; 起始字节位置(从1开始) / Start byte position (1-indexed)
# StartByte = 100
# ; 电话号码长度(字符数) / Phone number length (characters)
# PhoneLength = 10
# ; 旧格式：前置0数量 / Old format: leading zeros count
# OldLeadingZeros = 0
# ; 旧格式：后置0数量 / Old format: trailing zeros count
# OldTrailingZeros = 10
# ; 新格式：前置0数量 / New format: leading zeros count
# NewLeadingZeros = 6
# ; 新格式：后置0数量 / New format: trailing zeros count
# NewTrailingZeros = 4
# ; ========== 模版结束 / Template End ==========
#
# 【功能说明 / Description】
# 将电话号码字段从旧格式转换为新格式：
# 旧格式: [电话号码][后置0]  例如: 13812345670000000000
# 新格式: [前置0][电话号码][后置0]  例如: 00000013812345670000
#
# 【注意事项 / Notes】
# - 字节位置从1开始计数 (1-indexed)
# - 确保 OldLeadingZeros + PhoneLength + OldTrailingZeros = 总字段长度
# - 确保 NewLeadingZeros + PhoneLength + NewTrailingZeros = 总字段长度
# ============================================

[Settings]
; 每条记录的字节数 / Bytes per record
RecordSize = 1300
; 头部记录标识符 / Header record marker
HeaderMarker = 1
; 数据记录标识符 / Data record marker
DataMarker = 2

# ============================================
# 修改规则配置 / Modification Rule Configuration
# ============================================

[Rule-1]
Name = Phone-1
StartByte = 100
PhoneLength = 10
OldLeadingZeros = 0
OldTrailingZeros = 10
NewLeadingZeros = 6
NewTrailingZeros = 4

[Rule-2]
Name = Phone-2
StartByte = 200
PhoneLength = 10
OldLeadingZeros = 0
OldTrailingZeros = 10
NewLeadingZeros = 6
NewTrailingZeros = 4

